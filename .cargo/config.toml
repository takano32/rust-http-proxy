[build]
# **メモリの小さい環境 (Pterodactyl のコンテナ) でビルドできるようにするための設定。**
#
# rustc はクレート単位で全部を一度に抱えるので、1 プロセスで 150〜200 MB 使う。
# 既定の並列数だと複数の rustc が同時に走り、その合計がメモリ上限を超えて
# OOM killer に SIGKILL される (実測: 上限 200 MB の cgroup で、並列だと落ち、
# `-j 1` なら通る)。
#
# 代償はビルド時間で、8 コアの機械で 14.9 秒 → 32.3 秒。潤沢な機械で急ぐときは
# `cargo build --release -j 8` のように上書きできる。
jobs = 1
