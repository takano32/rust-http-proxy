name: watch

# デプロイ先の最小の見張り (T28.26。2026-10-25)。いままで tokyo の `/healthz` も `/metrics` も誰も読んでおらず、
# 異常に気づく経路は締めで人が雪像を読むときだけだった (無言の再起動 2 回も利用者に聞いて分かった、T23.99)。
# 読む口だけを引いて、`/healthz` が ok でない・**前回の済んだ見張りから**無言の再起動 (直前に `shutdown` の
# 無い `start`) がある、のどちらかで job を落とす (GitHub が失敗を知らせる)。
# **cron は毎時でも、GitHub の schedule は実際には 2〜7.5 時間おき** (10-26〜10-31 の 121.2 時間で 23 回、間隔の
# 中央値 5.5 時間) なので、窓は固定の 75 分ではなく前回の済んだ (成功か失敗の) 実行の時刻から取る (T32.25。取れなければ 480 分)。
# 前は「前回の**成功した**実行」から取っていたので、一度再起動を見つけると、そのあとの実行は同じ再起動を見つけ続けて
# 落ち続けた (2026-11-03 から 11-13 まで 36 回続けて赤。T36.99)。いまは 1 再起動につき 1 回 (15 分の重なりに
# 入れば 2 回) だけ落ちる。
# **このリポジトリは public なので、実行ログに雪像・個票・接続元・宛先を一切出さない** (結論と版と uptime だけ)。
# 書き換える口 (`/purge` など) と探り (プロキシとしての要求) は送らない。
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "見る先 (host:port)。既定はデプロイ先"
        required: false
        default: tokyo.sorahost.net:60357

permissions:
  contents: read
  # 前回の済んだ実行の時刻を読む (T32.25・T36.99)
  actions: read

jobs:
  watch:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - name: When did the last finished watch run
        id: last
        env:
          GH_TOKEN: ${{ github.token }}
        # いま走っているこの実行はまだ済んでいないので、先頭が前回。取り消した実行 (cancelled) は口を読み終えていない
        # かもしれないので飛ばす。取れなければ空 (watch-deployed.py が 480 分を見る)
        run: |
          since=$(gh run list -R "$GITHUB_REPOSITORY" --workflow watch.yml --status completed -L 20 \
            --json createdAt,conclusion \
            -q '[.[] | select(.conclusion == "success" or .conclusion == "failure")][0].createdAt' 2>/dev/null) || since=
          echo "前回の済んだ見張り: ${since:-取れない}"
          echo "since=$since" >>"$GITHUB_OUTPUT"
      - name: Look at /healthz and /events
        env:
          TARGET: ${{ inputs.target || 'tokyo.sorahost.net:60357' }}
          SINCE: ${{ steps.last.outputs.since }}
        run: python3 scripts/watch-deployed.py "$TARGET" ${SINCE:+--since "$SINCE"}
