name: release

on:
  push:
    tags:
      - "v*"
  # タグをこの workflow の中で打ってからビルドする口 (T.27.99。2026-10-24)。クラウドのセッションからは
  # タグの git push も GitHub API の書き込みも通らないので、GitHub のツールでこれを起動して打つ。
  # GITHUB_TOKEN で push したタグは別の workflow を起動しないので、上の `push: tags` と二重には走らない
  workflow_dispatch:
    inputs:
      version:
        description: "打つ版 (例 0.27.8。v は付けない)。本体の Cargo.toml の版と同じであること"
        required: true
      ref:
        description: "タグを打つコミット (既定は main の先頭)。main の上のコミットであること。短いハッシュ (ab12cd3)・完全な SHA・ブランチ名・main~1 の形が使える"
        required: false
        default: main
      unchecked:
        description: "CI (ci.yml の check) が通ったかを確かめずに打つ (既定 false。CI の走らないコミットなど、理由があるときだけ true)"
        required: false
        default: "false"

permissions:
  contents: write
  # タグを打つコミットの CI (ci.yml の `check`) の結果を読む (T.32.32)
  checks: read

jobs:
  tag:
    # workflow_dispatch のときだけ: 版を確かめ、注釈付きのタグを打って push する
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # 取り出すのは main (歴史とタグを全部)。入力の `ref` は下で git に解かせる (T.29.30): `actions/checkout` の
      # `ref` はブランチ・タグ・完全な SHA しか取れず、T.28.99 の 1 回目 (run 40254718138) は短いハッシュで落ちた
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve the ref (main の上のコミットか)
        id: ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          REF=${REF:-main}
          main=$(git rev-parse --verify -q "origin/main^{commit}") || { echo "origin/main が無い" >&2; exit 1; }
          # 短いハッシュ・完全な SHA・ブランチ名 (手元の枝が無ければ origin/ の枝)・main~1 などを 1 つのコミットに解く
          commit=$(git rev-parse --verify -q --end-of-options "$REF^{commit}" ||
            git rev-parse --verify -q --end-of-options "origin/$REF^{commit}") || {
            echo "ref '$REF' をコミットに解けない (短いハッシュが曖昧か、無いコミット)" >&2
            exit 1
          }
          # tokyo はタグではなく main の先頭でビルドしているので、main の上に無いコミットには打たない
          if ! git merge-base --is-ancestor "$commit" "$main"; then
            echo "ref '$REF' ($commit) は main ($main) の上に無い。main に入ったコミットを渡す" >&2
            exit 1
          fi
          git checkout -q --detach "$commit"
          behind=$(git rev-list --count "$commit..$main")
          # 件名の | は表を割るので逃がす
          one() { git log -1 --format='%h %s' "$1" | sed 's/|/\\|/g'; }
          {
            echo "| | コミット |"
            echo "|---|---|"
            echo "| 打つコミット (ref = $REF) | $(one "$commit") |"
            echo "| main の先頭 | $(one "$main") |"
            echo "| 差 | main の先頭より $behind コミット前 |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          echo "打つコミット: $commit (main の先頭 $main より $behind コミット前)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # CI が通ったコミットにだけ打つ (T.32.32)。v0.28.48 (b56160a) は同じコミットの CI が終わる前に打っていた
      # (結果は success、1 つ前のコミットは fmt で落ちていた)。`ci.yml` の `check` の最後の 1 回が
      # 終わっていて success でなければ、理由と CI の頁を出して落とす
      - name: Check that CI passed on the commit
        if: inputs.unchecked != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.ref.outputs.commit }}
        run: |
          set -eu
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/$COMMIT/check-runs?check_name=check&per_page=100" \
            -q '[.check_runs[]] | sort_by(.started_at) | last // empty | "\(.status) \(.conclusion) \(.html_url)"')
          if [ -z "$last" ]; then
            echo "$COMMIT に CI (ci.yml の check) の結果が無い。CI が走ってから打つ (理由があれば unchecked=true)" >&2
            exit 1
          fi
          read -r status conclusion url <<EOF_RUN
          $last
          EOF_RUN
          if [ "$status" != completed ]; then
            echo "$COMMIT の CI (check) がまだ終わっていない ($status): $url" >&2
            exit 1
          fi
          if [ "$conclusion" != success ]; then
            echo "$COMMIT の CI (check) が通っていない ($conclusion): $url" >&2
            exit 1
          fi
          echo "CI (check) は success: $url"
          echo "CI (ci.yml の check) は success ([頁]($url))" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the version and push the tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          have=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$have" != "$VERSION" ]; then
            echo "本体の版 ($have) と入力 ($VERSION) が違う" >&2
            exit 1
          fi
          python3 scripts/crate-versions.py --check
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag は既にある ($(git rev-parse "$tag^{commit}"))。打ち直さない" >&2
            exit 1
          fi
          git -c user.name='TAKANO Mitsuhiro' -c user.email='takano32@gmail.com' \
            tag -a "$tag" -m "$tag" HEAD
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "打った: $tag = $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: tag
    # タグの push で走ったとき (`tag` は飛ばされる) と、`tag` が打ち終えたとき
    if: always() && (github.event_name == 'push' || needs.tag.result == 'success')
    # 古めの glibc でビルドして、新しい環境でも古い環境でも動くようにする
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # musl 静的リンクは採らない (計測で forward が 1/3 になり、TLS も名前解決も落ちるため)
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_dispatch では、いま打ったタグを取り出す (push のときは既定のタグのまま)
          ref: ${{ needs.tag.outputs.tag || github.ref }}
          # クレートの版の決まりは「前回のデプロイ (版を書いたコミット) から中身が変わったか」を履歴で見るので、
          # 歴史とタグを全部取る (T.26.3)
          fetch-depth: 0
      # 各クレートの版が決まり (デプロイの番号 X.Y.Z、全クレート = 本体 = proxy-server = タグ) に合っているか。
      # 合わなければ名前と理由を出して落ちる (タスクの中での --task 忘れ等)
      - name: Check the crate versions
        run: python3 scripts/crate-versions.py --check
      - name: Install the Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install the cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        # 配布用は LTO ありの dist プロファイル (速さとバイナリの小ささを優先)
        run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Rename
        run: |
          cp target/${{ matrix.target }}/dist/rust-http-proxy rust-http-proxy-${{ matrix.target }}
          # 取り寄せた側が確かめられるように、ターゲットごとに SHA-256 を 1 行のファイルで添える (T.28.22)
          sha256sum rust-http-proxy-${{ matrix.target }} > rust-http-proxy-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v3
        with:
          # workflow_dispatch では github.ref がブランチなので、打ったタグを名指しする
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          files: |
            rust-http-proxy-${{ matrix.target }}
            rust-http-proxy-${{ matrix.target }}.sha256
