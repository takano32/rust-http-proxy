name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # 古めの glibc でビルドして、新しい環境でも古い環境でも動くようにする
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # musl 静的リンクは採らない (計測で forward が 1/3 になり、TLS も名前解決も落ちるため)
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust target
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
          rustup target add ${{ matrix.target }}
      - name: Install the cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename
        run: cp target/${{ matrix.target }}/release/rust-http-proxy rust-http-proxy-${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        with:
          files: rust-http-proxy-${{ matrix.target }}
