name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    # 古めの glibc でビルドして、新しい環境でも古い環境でも動くようにする
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # musl 静的リンクは採らない (計測で forward が 1/3 になり、TLS も名前解決も落ちるため)
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          # クレートの版の決まりは版の行と中身の最後の変更を履歴で比べるので、歴史とタグを全部取る (T21.6)
          fetch-depth: 0
      # 各クレートの版が決まり (中身を最後に変えたタスクの番号 0.P.T、本体 = proxy-server = 全部の最大 = タグ) に
      # 合っているか。合わなければ名前と理由を出して落ちる (タスクの中で --task を忘れた等。T21.6)
      - name: Check the crate versions
        run: python3 scripts/crate-versions.py --check
      - name: Install the Rust target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install the cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        # 配布用は LTO ありの dist プロファイル (速さとバイナリの小ささを優先)
        run: cargo build --profile dist --target ${{ matrix.target }}
      - name: Rename
        run: cp target/${{ matrix.target }}/dist/rust-http-proxy rust-http-proxy-${{ matrix.target }}
      - uses: softprops/action-gh-release@v3
        with:
          files: rust-http-proxy-${{ matrix.target }}
