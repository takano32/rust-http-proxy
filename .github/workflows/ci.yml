name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.96
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # ワークスペースなので --workspace が要る (無いと下の層のテストが走らない)
      - run: cargo test --workspace
      - run: cargo build --release
      # ベンチは既定のビルド対象から外してあるので明示的に作る
      - run: cargo build --release -p proxy-bench

      # 動作環境 (メモリの小さいコンテナ) でビルドできることを守る。
      # クレートごとの rustc の最大 RSS を測り、200 MB を超えたら落とす
      - name: Build memory
        run: |
          cargo clean
          ./scripts/build-memory.sh --find 120 130 140 150 160 170 180 190 200

      # ベンチは数字を残すだけ (閾値では落とさない。CI の機械は揺れるため)
      - name: Benchmark
        run: |
          HOME=$(mktemp -d) PROXY_ALLOW_LOCAL=on \
            ./target/release/rust-http-proxy --lite -p 18080 --bind 127.0.0.1 &
          sleep 2
          ./target/release/bench --proxy 127.0.0.1:18080 --conc 8 --seconds 2 | tee bench.txt
          {
            echo '### bench (--lite, 8 並列, 2 秒)'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
