name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  # 下の build-memory-find だけを回す口 (check は動かない)。
  # `gh workflow run ci.yml -f ladder="90 95 100"` でも回せる
  workflow_dispatch:
    inputs:
      ladder:
        description: "試す上限 (MB) を空白区切りで小さい順に。最初に通った値が答え"
        required: false
        default: "100 110 120 130 135 140 150 160 180"
  # 週 1 回 (月曜 03:17 UTC = 12:17 JST)。放っておくと値が古くなるため。
  # 毎時 0 分は GitHub 側が混んで待たされるので 17 分にずらしてある
  schedule:
    - cron: "17 3 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # push / PR のときだけ。手回しと週 1 は下のジョブのためのもの
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          # stable は版が上がるので、キャッシュの鍵に版を入れる (上がったら作り直す)
          echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUSTC_VERSION }}-${{ hashFiles('**/Cargo.toml') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 文書とコードが同じ集合か (エンドポイント・環境変数・`/snapshot` の部・画面の関数・クレートの表。T14.56)
      - run: ./scripts/check-docs.sh
      # scripts/ の道具の単体テスト (雪像の要約・判定・匿名化と、`scripts/mx` の test_mx.sh。T17.15)
      - run: python3 -m unittest discover -s scripts
      # scripts/ のシェルの静的検査 (T17.13)。設定 (切った指摘とその理由) は scripts/.shellcheckrc。
      # runner の像に入っていればそれを使い、無ければ入れる (ubuntu-latest が 2026-10-19 に Ubuntu 26 へ移るため)
      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck --version
          shellcheck scripts/*.sh scripts/mx
      # ワークスペースなので --workspace が要る (無いと下の層のテストが走らない)
      # 1 本落ちても残りの test binary を走らせる (落ちた全部を 1 回の CI で見る。2026-09-16)
      - run: cargo test --workspace --no-fail-fast
      - run: cargo build --release
      # ベンチは既定のビルド対象から外してあるので明示的に作る
      - run: cargo build --release -p proxy-bench

      # ベンチは数字を残すだけ (閾値では落とさない。CI の機械は揺れるため)
      - name: Benchmark
        run: |
          HOME=$(mktemp -d) PROXY_ALLOW_LOCAL=on \
            ./target/release/rust-http-proxy --lite -p 18080 --bind 127.0.0.1 &
          sleep 2
          ./target/release/bench --proxy 127.0.0.1:18080 --conc 8 --seconds 2 | tee bench.txt
          {
            echo '### bench (--lite, 8 並列, 2 秒)'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 動作環境 (メモリの小さいコンテナ) でビルドできることを守る (§0 の関門)。
  # 180 MB の cgroup (systemd-run --scope -p MemoryMax=180M) の中で実際に
  # リリースビルドを回し、rustc が OOM killer に落とされたら失敗する。
  # **これは毎回回す** (通るかどうかは push ごとに知りたい)。
  # 余裕がいくつあるか = 通る最小の上限は下の build-memory-find で測る。
  #
  # **`ubuntu-24.04` に固定する** (T17.13): `ubuntu-latest` は 2026-10-19 に Ubuntu 26 へ移る。
  # 関門の数字 (180 MB) とその余裕は runner の像ごとに測ったものなので、像が変わると出どころが動く。
  # 移すときは build-memory-find を新しい像で回してから、ここと下を一緒に変える。
  #
  # check ジョブの中の 1 段だったのを別のジョブにした (像を分けるため)。空の target から
  # 始まるので `cargo clean` は要らない。キャッシュも張らない (check のキャッシュを汚さない)。
  # なお check の中にあった頃は、この段の `cargo clean` で target/release/bench が消え、後ろの
  # Benchmark が「No such file or directory」のまま成功扱いになっていた (パイプの終了コードは tee のもの)
  build-memory:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build memory
        run: ./scripts/build-memory.sh 180

  # デプロイ先に似せた条件で短く回し、`/snapshot` を成果物として残す (T14.30)。
  #
  # **見張るのは「形の退行」だけで、数字の絶対値は比べない** (CI の runner は世代も負荷も毎回違う。
  # §1 のレシピの数字は手元の機械でしか取れない)。落とすのは 3 つだけ:
  #   1. `--only connect-multi` の p50 が 50 ms 以上 (= Happy Eyeballs の 250 ms が戻ってきた。T12.1)
  #   2. `/snapshot` が 1 要求で取れない・JSON として読めない (T14.4)
  #   3. `/status` の `ipv6.v4_first` か `/profile` の段階 (T14.3) が入っていない・全部 0
  #
  # **`check` とは並べて回す** (`needs:` を付けない) ので、CI の総時間はほとんど伸びない
  # (このジョブ自身は release ビルド + ベンチ 2 本 × 10 秒 + `/snapshot` で、手元では
  # スクリプトの部分が 26 秒。`check` の方が長いので、通算の待ち時間は増えない)。
  deployed-like-snapshot:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          # stable は版が上がるので、キャッシュの鍵に版を入れる (上がったら作り直す)
          echo "RUSTC_VERSION=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_ENV"
      # **読むだけ** (`restore`)。同じ鍵の保存は上の check ジョブに任せる
      # (同じ鍵で 2 つのジョブが保存すると後から来た方が「もうある」で終わるだけなので、
      # 鍵の持ち主を 1 つに決めておく)
      - name: Cache (restore only)
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUSTC_VERSION }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-${{ env.RUSTC_VERSION }}-

      # **先に**名前空間が作れるかを確かめて記録する。`scripts/deployed-like.sh` は
      # `unshare -rmnC` (ユーザー + マウント + ネット + cgroup) を要求し、作れなければ
      # 終了コード 2 で終わる。runner で作れないときは `scripts/ci-snapshot.sh` が
      # **IPv6 の黒穴だけ諦めて**残りを回す (`ipv6_blackhole: false`、CONNECT は IP リテラル宛て)
      - name: Can this runner build a user namespace?
        run: |
          if unshare -rmnC true 2>/dev/null; then
            ns='`unshare -rmnC` が通る → IPv6 の黒穴まで再現できる (`--only connect-multi`)'
          elif unshare -rmn true 2>/dev/null; then
            ns='`unshare -rmn` は通るが `-C` が通らない → 黒穴は諦める (`--only connect`)'
          else
            ns='ユーザー名前空間が作れない → 黒穴は諦める (`--only connect`)'
          fi
          echo "$ns"
          {
            echo '### デプロイ先に似せた条件 (T14.30)'
            echo ''
            echo "- 名前空間: $ns"
          } >> "$GITHUB_STEP_SUMMARY"

      - run: cargo build --release
      - run: cargo build --release -p proxy-bench

      # プロキシもベンチもスクリプトの中で `timeout` 付きで起動し、最後に自分で片づける
      - name: Deployed-like snapshot
        run: |
          set +e
          ./scripts/ci-snapshot.sh --seconds 10 --conc 8 2>&1 | tee ci-snapshot.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo ''
            echo '```'
            grep -E '^(ci-snapshot|cnct-mlt|connect|forward|deployed-like)' ci-snapshot.txt || tail -20 ci-snapshot.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      # **落ちたときこそ中身が要る**ので `if: always()`
      - name: Upload snapshot.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-like-snapshot
          path: |
            snapshot.json
            ci-snapshot.txt
          if-no-files-found: warn
          retention-days: 14

  # ビルドが通る最小のメモリを CI の機械で実測する (T11.7)。
  #
  # **なぜ push ごとに回さないか**: 上の `Build memory` が §0 の条件 (180 MB で通ること) を
  # 毎回確かめており、守りたいことはそれで足りている。ここで測るのは「余裕がいくつあるか」で、
  # コミット単位で追う必要は無い。段ごとに `cargo clean` からのビルドが 1 回要るので
  # (runner で 1 段 10〜16 秒、既定の 10 段で 2〜3 分)、刻むほど毎回の CI が延びる。
  # 値は機械の状態で 1 MB 単位にぶれる (境目は薄い。手元では 130 MB が落ちて 135 MB が通る) ので、
  # これを push の関門にすると偽陽性で止まる。
  #
  # **なぜ手回し (workflow_dispatch) と週 1 (schedule) の両方か**: 手回しは
  # クレートを割った直後など「いま知りたい」ときのため (ladder も指定できる)。
  # 週 1 は放っておくと値が古くなるため — 実際 T7.4 の 110 MB が Phase 8〜10 の間ずっと
  # §1 に載ったままになり、T10.9 で取り下げる羽目になった。
  # なお schedule は既定ブランチでしか走らず、リポジトリが 60 日動かないと GitHub に止められる。
  build-memory-find:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    # 上の build-memory と同じ像に固定する (測った最小と関門が同じ機械の数字になるように。T17.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      # キャッシュは張らない。--find は段ごとに `cargo clean` するので当たらないし、
      # 空になった target を check ジョブのキャッシュに上書きさせたくない

      # 出た数字を後から読めるように、測った機械の素性を残す。
      # とくに `scripts/build-memory.sh` が「システムの systemd → ユーザーの systemd →
      # 参考の RSS だけ」のどれに落ちたかは、値の意味が変わるので必ず記録する
      - name: Record what this runner is
        run: |
          {
            echo '### この計測を回した runner'
            echo ''
            echo "- image: \`${ImageOS:-?}\` / arch: \`$(uname -m)\` / kernel: \`$(uname -r)\`"
            echo "- CPU $(nproc) 個 / MemTotal $(awk '/^MemTotal:/{printf "%.1f GiB", $2/1048576}' /proc/meminfo)"
            echo "- PID 1: \`$(cat /proc/1/comm)\` / cgroup v$(test -e /sys/fs/cgroup/cgroup.controllers && echo 2 || echo 1)"
            echo "- $(rustc -V) / host: $(rustc -vV | awk '/^host:/{print $2}')"
            if sudo -n systemd-run --scope --quiet -p MemoryMax=64M /bin/true > /dev/null 2>&1; then
              echo '- cgroup の経路: **システムの systemd** (`sudo systemd-run --scope`)'
            elif systemd-run --user --scope --quiet -p MemoryMax=64M -p MemorySwapMax=0 /bin/true > /dev/null 2>&1; then
              echo '- cgroup の経路: **ユーザーの systemd** (`systemd-run --user --scope`)'
            else
              echo '- cgroup の経路: **無し** (この runner では判定できない。--find は exit 2 で落ちる)'
            fi
            echo ''
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # 小さい上限から順に「その cgroup の中でリリースビルドが通るか」を試し、
      # 最初に通った上限を答えにする。cgroup を作れない runner では exit 2 で落ちる
      # (黙って「測れなかった」で終わらせない)
      - name: Build memory (find the minimum)
        env:
          # schedule のときは github.event.inputs が無いので既定の段になる
          # (`inputs` 文脈は手回しでしか無いので `github.event.inputs` の方を使う)
          LADDER: ${{ github.event.inputs.ladder || '100 110 120 130 135 140 150 160 180' }}
        run: |
          case "$LADDER" in
            "" | *[!0-9\ ]*)
              echo "ladder は空白区切りの数字で指定してください: $LADDER"
              exit 1
              ;;
          esac
          set +e
          ./scripts/build-memory.sh --find $LADDER 2>&1 | tee find.txt
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo '### ビルドが通る最小のメモリ (CI)'
            echo ''
            echo "試した上限: \`$LADDER\` MB"
            echo '```'
            grep -E '^(=== |  [0-9]+ MB では|通る最小の上限|どの上限でも|cgroup を作れない)' find.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
