[workspace]
members = [
    "crates/sys",
    "crates/base",
    "crates/rrd",
    "crates/sysinfo",
    "crates/workers",
    "crates/tls",
    "crates/msg",
    "crates/net-dns",
    "crates/net-conn",
    "crates/net",
    "crates/origin",
    "crates/cachekey",
    "crates/cachecfg",
    "crates/diskprobe",
    "crates/capacity",
    "crates/cachemem",
    "crates/cachedisk",
    "crates/cache",
    "crates/config",
    "crates/selfbench",
    "crates/metrics-types",
    "crates/metrics-recent",
    "crates/metrics-profile",
    "crates/metrics-window",
    "crates/metrics-core",
    "crates/metrics-slo",
    "crates/metrics-watch",
    "crates/metrics",
    "crates/blocklist",
    "crates/reload",
    "crates/prom",
    "crates/freshness",
    "crates/http",
    "crates/tunnel",
    "crates/web",
    "crates/endpoints-core",
    "crates/endpoints-explain",
    "crates/endpoints",
    "crates/server",
    "crates/run",
    "crates/bench",
]

# 既定のビルド対象はプロキシ本体だけ。計測用の bench は `-p proxy-bench` で明示的に作る
# (メモリの小さい環境で `cargo run --release` が余計なものをビルドしないように)。
default-members = ["."]

[package]
name = "rust-http-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
# 自分のコードを層ごとに分けたもの。**外部クレートは 1 つも使わない** (すべて std のみ)。
# 1 クレートが大きいと rustc がまとめて抱えてビルドの最大 RSS が上がるため
# (実測: 18,276 行 1 クレートで 330 MB、動作環境の上限は 120 MB = SERVER_MEMORY 256 MiB)。
# ルートのパッケージは **facade と bin だけ** (T15.12 段 6')。本体は `crates/server`。
proxy-server = { path = "crates/server" }
proxy-run = { path = "crates/run" }

# メモリの小さい環境 (Pterodactyl コンテナ) でも通ることを優先した既定のプロファイル。
# LTO を切っているのは、まとめて最適化する**最終リンクの 1 回**が大きいため。
# クレートを 26 に割っても最終リンクは全部を抱えるので、そこは小さくならなかった。
#
# いまのこのプロファイルの実測 (2026-09-26、T17.11 = T15.12 段 8 で上位 2 クレートを割った後。全クレート
# `codegen-units = 4`。手元 aarch64、rustc 1.98.1):
#   手元の cgroup で通る最小は 90 MB (4 回とも通る。85 MB 以下は 2 回とも落ちる。上限 120 MB に対して 1.33 倍の余裕)、
#   バイナリ 2,760,504 B (割る前の main と同じ大きさ。段 7 の直後 2026-09-24 は 2,694,968 B)。
#   段 7 の直後 (2026-09-24〜26) は通る最小 105 MB (100 MB 以下は毎回落ちる)。
#   段 5 (2026-09-19) の時点は通る最小 120〜125 MB (115 MB は落ちる。120 は回ごとに揺れる境目)。
#   CPU は 41.4 us/要求 (forward 8 並列。--lite + ログ warn、プロキシ cpu4-7 / ベンチ cpu0-3 に固定、
#   本文 1 KiB、10 秒 × 3 回の中央値。2026-09-08 の T10.11 の値。段 5 / 段 7 では測り直していない)。
#   以下は歴史: 通る最小 135 MB / バイナリ 1,381,872 B (2026-09-08、T14.55 / T11.5)、
#   通る最小を決めているのはいちばん大きいクレート + 14 MB (proxy-http 85.5 MB の頃。T10.9)。
#
# LTO を選び直したときの実測 (2026-09-07、T9.1。26 クレート・`jobs = 1`、aarch64、
# 手元の cgroup で通る最小の上限。3 つを同じ日に測った比較なので、バイナリと CPU は当時のコードの値):
#   lto = false → 100 MB、38.7 秒、1,316,336 B、CPU 50.19 us/要求  ← これ
#   lto = "thin"→ 170 MB、55.4 秒、1,316,328 B、CPU 50.09 us/要求 (-0.2%、ぶれの中)
#   lto = "fat" → 350 MB、48.8 秒、1,185,248 B、CPU 47.95 us/要求 (-4.5%)
# fat は効くが上限 120 MB の約 3 倍。thin は 170 MB 払って何も返ってこない
# (バイナリは 8 バイトしか変わらない)。よって切ったままにする (T9.1)。
#
# 配布するバイナリは下の dist プロファイル (fat LTO) で作る。
#
# `codegen-units` は 2026-09-19 (T15.12 段 5) まで**一度も測らずに** 1 だったので測った。
# ビルドの山はコード生成 (LLVM) の段で、1 だとクレート全体の LLVM IR を 1 つのモジュールとして
# 一度に抱える。全クレートに当てた実測 (手元 aarch64、`jobs = 1`、`cargo clean --release` →
# `cargo build --release`、20 ms ごとの RssAnon の最大):
#
#   クレート                   1 (既定)    4        16
#   proxy-metrics-watch        121.7 MB    92.5     84.3
#   proxy-metrics-window       106.8       83.2     81.4
#   proxy-endpoints             97.9       80.2     80.2
#   本体 (rust_http_proxy)      94.6       79.2     79.3
#   proxy-metrics-recent        95.5       76.9     75.4
#   通る最小 (`--find`)        140 MB     120 MB   115 でも通らない
#   release の時間 / バイナリ  95 秒      106 秒   133 秒
#                              2,498,360 B 2,694,968 B 2,760,504 B
#
# この表の「本体 (rust_http_proxy)」の行は T15.12 段 6' より前のもの。段 6' で本体を
# `proxy-server` (中身) と `proxy-run` (`main` の中身) に分けた。
#
# 4 → 16 はほとんど減らない (コード生成の前の段 = 型検査とメタデータの床が約 80 MB) ので **4 で十分**。
#
# **全クレートを 4 にしてある** (T15.12 段 7、2026-09-24 の利用者の決定: 4 で次の再デプロイに入れて試す)。
# `codegen-units` を増やすとクレートの中のインライン化の範囲が狭まるので、速さへの効きは
# **デプロイ先で「桁で悪くなっていないか」だけを見る** (conn 役のコア/要求が前の 1.3 倍を超える、
# `/profile` のユーザー空間の段階が目に見えて太る、`cpu_throttled` が出る、のどれか。数 % の差は読まない。
# この機械もデプロイ先も共有で CPU/要求 が ±4% 以上ぶれるので、手元の A/B は取っていない)。
# **悪くなっていたら下の `codegen-units = 4` を 1 に戻す 1 行で戻る**。
# 手元で確かめた揺れない数字 (2026-09-24): `--lite` のシステムコール 5.022 → 5.023 回/要求、
# 確保 10.006 → 10.006 回/要求 (要求の経路のシステムコールと確保は変わらない)。
# 全クレート 4 の RssAnon の上位: proxy-metrics-watch 92.3 > proxy-metrics-window 82.9
# > proxy-endpoints 79.9 > proxy-server 79.6 > proxy-metrics-recent 75.4 MB (クリーンの release 97 → 103 秒)。
# 歴史: 2026-09-19 (段 5) から 2026-09-24 (段 7) までは、要求の経路に乗らない 9 個
# (proxy-metrics-watch / -endpoints-explain / -endpoints-core / -config / -prom / -rrd / -diskprobe /
# -capacity / proxy-bench) だけを `[profile.release.package.<名前>]` で 4 にし、要求の経路のクレートは
# 1 のままにしていた (proxy-endpoints / -metrics-window / -selfbench / -reload / -sysinfo は
# 要求の経路から呼ばれるので 1。段 5 の結果)。その頃の上位は proxy-metrics-window 107.8 > proxy-endpoints 98.4 MB。
[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 4

# 配布用。速さとバイナリの小ささを優先し、ビルドのメモリは気にしない
# (GitHub Actions のような潤沢な環境で使う)。`cargo build --profile dist`
# release との違いは 3 つ: `opt-level` が "s"、`lto` が fat、`codegen-units` が 1。
# `codegen-units = 1` は T15.12 段 7 (2026-09-24) で足した: release を全クレート 4 にすると、dist は
# ファイルの大きさこそ 1,842,976 B のまま (ページの詰め物で隠れる) だが `.text` が 1,769,784 → 1,786,700 B
# (+16.9 KB) に太った (fat LTO でも CGU の分割は全部は呑まれない)。1 に戻すと `.text` 1,766,292 B
# (段 5 の 9 個の上書きも消えたので段 5 の前の形。ファイルは 1,842,976 B)。
# 実測 (2026-09-24、T15.12 段 7): 1,842,976 B (release は 2,694,968 B なので 852 KB 小さい)。
# 段 6' (2026-09-19) の時点も 1,842,976 B (release 2,563,896 B)。
# ビルドには 350 MB 以上要る (T9.1)。
# 歴史: 2026-09-08 の時点は dist 1,054,184 B / release 1,381,872 B (327 KB 小さい)。
# 速さは release に対して forward 8 並列 +1.9% (CPU/要求 41.4 → 39.6 us で -4.4%。2026-09-08 の値)、
# キャッシュ HIT +0.7%、64 並列 -1.2% で、CPU 以外はほぼぶれの中 (T10.11)。
# ユーザー空間だけ速くしても全体がこの程度しか動かないのは、CPU/要求 の 7 割前後が
# カーネル側 (recvfrom / sendto) だから (T9.1)。配布を dist のままにしているのは主に大きさのため。
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

