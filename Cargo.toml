[workspace]
members = [
    "crates/sys",
    "crates/base",
    "crates/rrd",
    "crates/sysinfo",
    "crates/workers",
    "crates/tls",
    "crates/msg",
    "crates/net-dns",
    "crates/net-conn",
    "crates/net",
    "crates/origin",
    "crates/cachekey",
    "crates/cachecfg",
    "crates/diskprobe",
    "crates/capacity",
    "crates/cachemem",
    "crates/cachedisk",
    "crates/cache",
    "crates/config",
    "crates/selfbench",
    "crates/metrics-types",
    "crates/metrics-recent",
    "crates/metrics-window",
    "crates/metrics-core",
    "crates/metrics-watch",
    "crates/metrics",
    "crates/blocklist",
    "crates/reload",
    "crates/prom",
    "crates/freshness",
    "crates/http",
    "crates/tunnel",
    "crates/web",
    "crates/endpoints-core",
    "crates/endpoints-explain",
    "crates/endpoints",
    "crates/server",
    "crates/run",
    "crates/bench",
]

# 既定のビルド対象はプロキシ本体だけ。計測用の bench は `-p proxy-bench` で明示的に作る
# (メモリの小さい環境で `cargo run --release` が余計なものをビルドしないように)。
default-members = ["."]

[package]
name = "rust-http-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
# 自分のコードを層ごとに分けたもの。**外部クレートは 1 つも使わない** (すべて std のみ)。
# 1 クレートが大きいと rustc がまとめて抱えてビルドの最大 RSS が上がるため
# (実測: 18,276 行 1 クレートで 330 MB、動作環境の上限は 180 MB = SERVER_MEMORY 256 MiB)。
# ルートのパッケージは **facade と bin だけ** (T15.12 段 6')。本体は `crates/server`。
proxy-server = { path = "crates/server" }
proxy-run = { path = "crates/run" }

# メモリの小さい環境 (Pterodactyl コンテナ) でも通ることを優先した既定のプロファイル。
# LTO を切っているのは、まとめて最適化する**最終リンクの 1 回**が大きいため。
# クレートを 26 に割っても最終リンクは全部を抱えるので、そこは小さくならなかった。
#
# いまのこのプロファイルの実測 (2026-09-19、T15.12 段 5。手元 aarch64):
#   手元の cgroup で通る最小 120〜125 MB (115 MB は落ちる。120 は回ごとに揺れる境目。
#   上限 180 MB に対して 1.4 倍以上の余裕)、
#   バイナリ 2,563,896 B (段 5 の前は 2,498,360 B)。
#   CPU は 41.4 us/要求 (forward 8 並列。--lite + ログ warn、プロキシ cpu4-7 / ベンチ cpu0-3 に固定、
#   本文 1 KiB、10 秒 × 3 回の中央値。2026-09-08 の T10.11 の値。段 5 では測り直していない)。
#   以下は歴史: 通る最小 135 MB / バイナリ 1,381,872 B (2026-09-08、T14.55 / T11.5)、
#   通る最小を決めているのはいちばん大きいクレート + 14 MB (proxy-http 85.5 MB の頃。T10.9)。
#
# LTO を選び直したときの実測 (2026-09-07、T9.1。26 クレート・`jobs = 1`、aarch64、
# 手元の cgroup で通る最小の上限。3 つを同じ日に測った比較なので、バイナリと CPU は当時のコードの値):
#   lto = false → 100 MB、38.7 秒、1,316,336 B、CPU 50.19 us/要求  ← これ
#   lto = "thin"→ 170 MB、55.4 秒、1,316,328 B、CPU 50.09 us/要求 (-0.2%、ぶれの中)
#   lto = "fat" → 350 MB、48.8 秒、1,185,248 B、CPU 47.95 us/要求 (-4.5%)
# fat は効くが上限 180 MB の約 2 倍。thin は 170 MB 払って何も返ってこない
# (バイナリは 8 バイトしか変わらない)。よって切ったままにする (T9.1)。
#
# 配布するバイナリは下の dist プロファイル (fat LTO) で作る。
#
# `codegen-units` は 2026-09-19 (T15.12 段 5) まで**一度も測らずに** 1 だったので測った。
# ビルドの山はコード生成 (LLVM) の段で、1 だとクレート全体の LLVM IR を 1 つのモジュールとして
# 一度に抱える。全クレートに当てた実測 (手元 aarch64、`jobs = 1`、`cargo clean --release` →
# `cargo build --release`、20 ms ごとの RssAnon の最大):
#
# (この表の 4 / 16 の列は**全クレートに当てたとき**の値で、下に並べた実際の上書きでの値ではない。
#  実際の設定では要求の経路の proxy-metrics-window と proxy-endpoints は `= 1` のままなので
#  107.8 / 98.4 MB、`= 4` にした proxy-metrics-watch は 91.5 MB。通る最小はどちらも 120〜125 MB
#  (同じ機械でも回ごとに揺れる。README の「ビルド・テスト」の注)。)
#
#   クレート                   1 (既定)    4        16
#   proxy-metrics-watch        121.7 MB    92.5     84.3
#   proxy-metrics-window       106.8       83.2     81.4
#   proxy-endpoints             97.9       80.2     80.2
#   本体 (rust_http_proxy)      94.6       79.2     79.3
#   proxy-metrics-recent        95.5       76.9     75.4
#   通る最小 (`--find`)        140 MB     120 MB   115 でも通らない
#   release の時間 / バイナリ  95 秒      106 秒   133 秒
#                              2,498,360 B 2,694,968 B 2,760,504 B
#
# この表の「本体 (rust_http_proxy)」の行は T15.12 段 6' より前のもの。段 6' で本体を
# `proxy-server` (中身) と `proxy-run` (`main` の中身) に分けたので、`= 1` の実測は
# proxy-server 94.9 / proxy-run 94.7 / ルートの rust-http-proxy 18.1 MB (facade + bin だけ) に割れた
# (2026-09-19)。どちらも要求の経路なので `= 1` のまま。
#
# 4 → 16 はほとんど減らない (コード生成の前の段 = 型検査とメタデータの床が約 80 MB) ので **4 で十分**。
# ただし `codegen-units` を増やすとクレートの中のインライン化の範囲が狭まるので、
# **要求の経路 (1 要求・1 接続ごとに通るコード) のクレートは 1 のまま**にしてある
# (この機械は CPU が汚れていて A/B が取れない。静かな機械で測ってから決める = T15.12 段 7)。
# 下の上書きは「tick スレッド・管理用の口・起動・道具しか呼ばないクレート」だけ。
[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 1

# ここから下は**要求の経路に乗らないクレート**だけ (T15.12 段 5、2026-09-19)。
# `crates/server/src/lib.rs` の `serve` の accept ループ → `run_conn` → `serve_one` → forward / トンネルの転送を
# たどって、1 要求・1 接続ごとに関数が呼ばれないことを確かめたものを並べてある。
# `[profile.dist]` は `inherits = "release"` なので同じ上書きが効く (バイナリの大きさが
# 変わらないことを確かめてある)。

# 窓を読んで判定するもの (SLO / 日次 / 雪像 / 異常 / canary)。呼ぶのは tick スレッドと管理用の口だけ。
[profile.release.package.proxy-metrics-watch]
codegen-units = 4

# `/explain` の本文。管理用の口からしか呼ばれない。
[profile.release.package.proxy-endpoints-explain]
codegen-units = 4

# 口の共通の土台 (`Endpoint` の型と問い合わせ文字列の読み方)。`Endpoint` の組み立ては
# 呼び出し側のコードなので、このクレートの関数は口の中からしか呼ばれない。
[profile.release.package.proxy-endpoints-core]
codegen-units = 4

# 設定の読み取り。要求の経路が触るのは `Config` のフィールドの参照だけ (関数を呼ばない)。
[profile.release.package.proxy-config]
codegen-units = 4

# `/metrics` (Prometheus 形式) の組み立て。
[profile.release.package.proxy-prom]
codegen-units = 4

# 状態ファイルの読み書き (`.rrd` / `.recent`)。書くのは tick スレッド、読むのは起動のとき。
[profile.release.package.proxy-rrd]
codegen-units = 4

# ディスクの容量の探り。`DiskProbe::load` は起動、`tick` は probe スレッド。
[profile.release.package.proxy-diskprobe]
codegen-units = 4

# キャッシュの割当の計算。`budget` は probe スレッド、`quota::is_permanent` は失敗した枝だけ。
[profile.release.package.proxy-capacity]
codegen-units = 4

# 計測用の道具 (`default-members` の外なので `cargo build --release` では作られない)。
[profile.release.package.proxy-bench]
codegen-units = 4

# 配布用。速さとバイナリの小ささを優先し、ビルドのメモリは気にしない
# (GitHub Actions のような潤沢な環境で使う)。`cargo build --profile dist`
# release との違いは 2 つだけ: `opt-level` が "s"、`lto` が fat。
# 実測 (2026-09-19、T15.12 段 6'): 1,842,976 B (release は 2,563,896 B なので 721 KB 小さい。
# 段 5 の codegen-units の上書きは dist にも伝わるが、fat LTO が CGU の分割を呑むので
# dist のバイナリは段 5 の前後とも 1,842,984 B で変わらず、段 6' で -8 B になっただけ)。
# ビルドには 350 MB 以上要る (T9.1)。
# 歴史: 2026-09-08 の時点は dist 1,054,184 B / release 1,381,872 B (327 KB 小さい)。
# 速さは release に対して forward 8 並列 +1.9% (CPU/要求 41.4 → 39.6 us で -4.4%。2026-09-08 の値)、
# キャッシュ HIT +0.7%、64 並列 -1.2% で、CPU 以外はほぼぶれの中 (T10.11)。
# ユーザー空間だけ速くしても全体がこの程度しか動かないのは、CPU/要求 の 7 割前後が
# カーネル側 (recvfrom / sendto) だから (T9.1)。配布を dist のままにしているのは主に大きさのため。
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true

