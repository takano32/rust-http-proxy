[workspace]
members = [
    "crates/sys",
    "crates/base",
    "crates/rrd",
    "crates/sysinfo",
    "crates/workers",
    "crates/tls",
    "crates/msg",
    "crates/net",
    "crates/origin",
    "crates/cachekey",
    "crates/cachecfg",
    "crates/diskprobe",
    "crates/capacity",
    "crates/cachemem",
    "crates/cachedisk",
    "crates/cache",
    "crates/config",
    "crates/metrics",
    "crates/blocklist",
    "crates/reload",
    "crates/prom",
    "crates/freshness",
    "crates/http",
    "crates/tunnel",
    "crates/endpoints",
    "crates/bench",
]

# 既定のビルド対象はプロキシ本体だけ。計測用の bench は `-p proxy-bench` で明示的に作る
# (メモリの小さい環境で `cargo run --release` が余計なものをビルドしないように)。
default-members = ["."]

[package]
name = "rust-http-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
# 自分のコードを層ごとに分けたもの。**外部クレートは 1 つも使わない** (すべて std のみ)。
# 1 クレートが大きいと rustc がまとめて抱えてビルドの最大 RSS が上がるため
# (実測: 18,276 行 1 クレートで 330 MB、動作環境の上限は 200 MB = SERVER_MEMORY 256 MiB)。
proxy-base = { path = "crates/base" }
proxy-blocklist = { path = "crates/blocklist" }
proxy-cache = { path = "crates/cache" }
proxy-config = { path = "crates/config" }
proxy-endpoints = { path = "crates/endpoints" }
proxy-http = { path = "crates/http" }
proxy-metrics = { path = "crates/metrics" }
proxy-msg = { path = "crates/msg" }
proxy-net = { path = "crates/net" }
proxy-origin = { path = "crates/origin" }
proxy-prom = { path = "crates/prom" }
proxy-reload = { path = "crates/reload" }
proxy-sys = { path = "crates/sys" }
proxy-sysinfo = { path = "crates/sysinfo" }
proxy-tunnel = { path = "crates/tunnel" }
proxy-workers = { path = "crates/workers" }

# メモリの小さい環境 (Pterodactyl コンテナ) でも通ることを優先した既定のプロファイル。
# LTO を切っているのは、まとめて最適化する**最終リンクの 1 回**が大きいため。
# クレートを 26 に割っても最終リンクは全部を抱えるので、そこは小さくならなかった。
#
# 26 クレート・`jobs = 1` で測り直した実測 (aarch64、手元の cgroup で通る最小の上限):
#   lto = false → 100 MB、38.7 秒、1,316,336 B、CPU 50.19 us/要求  ← これ
#   lto = "thin"→ 170 MB、55.4 秒、1,316,328 B、CPU 50.09 us/要求 (-0.2%、ぶれの中)
#   lto = "fat" → 350 MB、48.8 秒、1,185,248 B、CPU 47.95 us/要求 (-4.5%)
# fat は効くが上限 200 MB の 1.75 倍。thin は 170 MB 払って何も返ってこない
# (バイナリは 8 バイトしか変わらない)。よって切ったままにする (T9.1)。
#
# 配布するバイナリは下の dist プロファイル (fat LTO) で作る。
[profile.release]
opt-level = 3
lto = false
strip = true
codegen-units = 1

# 配布用。速さとバイナリの小ささを優先し、ビルドのメモリは気にしない
# (GitHub Actions のような潤沢な環境で使う)。`cargo build --profile dist`
# release との違いは 2 つだけ: `opt-level` が "s"、`lto` が fat。
# 実測: 988,648 B (release は 1,316,336 B)、ビルドに 350 MB 以上要る。
# ユーザー空間の CPU は release の 15.88 → 14.68 us/要求 (-7.6%) だが、
# CPU/要求 の 68% はカーネル側なので全体では 2〜3% にしかならない (T9.1)。
[profile.dist]
inherits = "release"
opt-level = "s"
lto = true

