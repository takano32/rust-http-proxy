[package]
name = "proxy-endpoints"
version = "0.28.46"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
# 試験のときだけ効く口 (T22.6)。立てるのはルートの `[dev-dependencies]` だけで、
# 既定のビルド (`cargo build --release`) には入らない
test-hooks = []

[dependencies]
proxy-base = { path = "../base" }
proxy-net = { path = "../net" }
proxy-cache = { path = "../cache" }
proxy-http = { path = "../http" }
proxy-metrics = { path = "../metrics" }
proxy-blocklist = { path = "../blocklist" }
proxy-reload = { path = "../reload" }
proxy-prom = { path = "../prom" }
proxy-endpoints-core = { path = "../endpoints-core" }
proxy-endpoints-explain = { path = "../endpoints-explain" }
proxy-web = { path = "../web" }
