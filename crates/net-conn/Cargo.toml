[package]
name = "proxy-net-conn"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
proxy-net-dns = { path = "../net-dns" }
# `proxy_base::timeout` を名指しで使うため (facade 越しではない)
proxy-base = { path = "../base" }
# 待ち受けソケットを自分で作るため (`socket` / `bind` / `listen(fd, backlog)`。T14.47)。
# Linux 以外では使わない (`std` の `bind` のまま)
proxy-sys = { path = "../sys" }
