<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sorahost-http-proxy</title>
<style>
:root{--bg:#0f1117;--card:#171a23;--line:#262a37;--fg:#e6e8ef;--muted:#8b91a5;--accent:#5aa9ff;--ok:#3ecf8e;--warn:#f5b342;--bad:#ff6b6b;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(15,17,23,.92);backdrop-filter:blur(6px);z-index:2}
header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em}
header .sub{color:var(--muted);font-size:12px}
header .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 8px var(--ok)}
.dot.bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
main{padding:18px 22px 40px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.charts{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h2{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
canvas{width:100%;height:150px;display:block}
.chart h2 span{float:right;color:var(--fg);font-variant-numeric:tabular-nums}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-top:14px}
@media(max-width:900px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
td:first-child,th:first-child{text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12px}
.mini{display:inline-block;height:6px;background:var(--line);width:80px;border-radius:3px;overflow:hidden;vertical-align:middle;margin-left:6px}
.mini i{display:block;height:100%;background:var(--ok)}
form{display:flex;gap:8px;margin-top:8px}
input[type=text]{flex:1;background:#0b0d13;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:9px 11px;font:13px var(--mono);outline:none}
input[type=text]:focus{border-color:var(--accent)}
button{background:var(--accent);color:#0b0d13;border:0;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button.danger{background:var(--bad);color:#fff}
button:disabled{opacity:.5;cursor:default}
pre{background:#0b0d13;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.45 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;margin:10px 0 0;color:#c9d1e3}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;background:var(--line);color:var(--muted);margin-left:6px}
.links a{color:var(--accent);text-decoration:none;margin-right:12px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>sorahost-http-proxy</h1>
  <span class="sub" id="uptime">–</span>
  <div class="right">
    <span class="links"><a href="/status" target="_blank">/status</a><a href="/metrics" target="_blank">/metrics</a><a href="/history" target="_blank">/history</a></span>
    <label><input type="checkbox" id="pause"> 一時停止</label>
    <span class="dot" id="dot"></span><span id="lastok">接続中…</span>
  </div>
</header>
<main>
  <section class="grid">
    <div class="card"><h2>要求 / 秒</h2><div class="kpi" id="rps">–</div><div class="hint" id="reqtotal"></div></div>
    <div class="card"><h2>転送 / 秒</h2><div class="kpi" id="bps">–</div><div class="hint" id="bytestotal"></div></div>
    <div class="card"><h2>接続中</h2><div class="kpi" id="active">–</div><div class="hint" id="origins"></div></div>
    <div class="card"><h2>キャッシュ命中率</h2><div class="kpi" id="hitratio">–</div><div class="hint" id="hitdetail"></div></div>
    <div class="card"><h2>メモリキャッシュ</h2><div class="kpi" id="memkpi">–</div><div class="bar"><i id="membar"></i></div><div class="hint" id="memhint"></div></div>
    <div class="card"><h2>ディスクキャッシュ</h2><div class="kpi" id="diskkpi">–</div><div class="bar"><i id="diskbar"></i></div><div class="hint" id="diskhint"></div></div>
  </section>

  <section class="grid charts">
    <div class="card chart"><h2>要求 / 秒 <span id="c-rps"></span></h2><canvas id="ch-rps"></canvas></div>
    <div class="card chart"><h2>転送 MB / 秒 <span id="c-bps"></span></h2><canvas id="ch-bps"></canvas></div>
    <div class="card chart"><h2>命中率 % (区間) <span id="c-hit"></span></h2><canvas id="ch-hit"></canvas></div>
    <div class="card chart"><h2>接続数 <span id="c-active"></span></h2><canvas id="ch-active"></canvas></div>
    <div class="card chart"><h2>メモリ MB (使用 / 上限 / RSS) <span id="c-mem"></span></h2><canvas id="ch-mem"></canvas></div>
    <div class="card chart"><h2>ディスク MB (使用 / 上限) <span id="c-disk"></span></h2><canvas id="ch-disk"></canvas></div>
  </section>

  <section class="row">
    <div class="card">
      <h2>操作</h2>
      <form id="f-lookup"><input type="text" id="url" placeholder="https://example.com/path または http://host/path" autocomplete="off"><button type="submit">照会</button><button type="button" id="btn-purge" class="ghost">この URL を消す</button></form>
      <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
        <button type="button" id="btn-purge-all" class="danger">キャッシュを全部消す</button>
        <span class="hint">確認のうえ /purge?all=1 を呼びます</span>
      </div>
      <pre id="out">ここに結果が出ます</pre>
    </div>
    <div class="card">
      <h2>キャッシュの内訳</h2>
      <table id="cachetbl"><tbody></tbody></table>
    </div>
  </section>

  <section class="card" style="margin-top:14px">
    <h2>ホスト別 (上位 20)</h2>
    <div style="overflow-x:auto"><table id="hosts"><thead><tr><th>host</th><th>要求</th><th>命中</th><th>ミス</th><th>素通し</th><th>エラー</th><th>転送</th><th>命中率</th></tr></thead><tbody></tbody></table></div>
  </section>
</main>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var hist=[];       // {t,requests,bytes,active,hits,misses,mem_used,mem_limit,disk_used,disk_limit,rss}
var last=null;     // 直近の /status
var lastSample=null;
function fmtBytes(n){if(n==null)return'–';var u=['B','KiB','MiB','GiB','TiB'],i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return(i?n.toFixed(n<10?2:1):n)+' '+u[i]}
function fmtNum(n){return n==null?'–':Number(n).toLocaleString()}
function fmtDur(s){var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+(h?h+'h ':'')+m+'m'}
function pct(a,b){return b>0?Math.min(100,a/b*100):0}
function barClass(p){return p>=95?'bad':p>=80?'warn':''}

function rates(){ // hist から区間ごとの派生値
  var r=[];
  for(var i=1;i<hist.length;i++){var a=hist[i-1],b=hist[i],dt=Math.max(1,b.t-a.t);var dh=b.hits-a.hits,dm=b.misses-a.misses;
    r.push({t:b.t,rps:(b.requests-a.requests)/dt,bps:(b.bytes-a.bytes)/dt/1048576,hit:(dh+dm)>0?dh/(dh+dm)*100:null,active:b.active,
      mem:b.mem_used/1048576,memlim:b.mem_limit/1048576,rss:b.rss/1048576,disk:b.disk_used/1048576,disklim:b.disk_limit/1048576});}
  return r;
}
function drawChart(id,series,opts){
  var c=$(id),dpr=window.devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;
  if(c.width!==W*dpr||c.height!==H*dpr){c.width=W*dpr;c.height=H*dpr}
  var g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  var padL=44,padR=8,padT=8,padB=18,w=W-padL-padR,h=H-padT-padB;
  var n=0,max=opts.max||0,min=0;
  series.forEach(function(s){n=Math.max(n,s.data.length);s.data.forEach(function(v){if(v!=null&&v>max)max=v})});
  if(max<=0)max=1; max*=1.1;
  g.strokeStyle='#262a37';g.lineWidth=1;g.fillStyle='#8b91a5';g.font='11px system-ui';g.textAlign='right';
  for(var i=0;i<=4;i++){var y=padT+h-h*i/4;g.beginPath();g.moveTo(padL,y);g.lineTo(W-padR,y);g.stroke();
    var v=max*i/4;g.fillText(opts.fmt?opts.fmt(v):(v>=100?Math.round(v):v.toFixed(v<10?1:0)),padL-6,y+4)}
  var span=Math.max(1,n-1);
  series.forEach(function(s){g.beginPath();g.strokeStyle=s.color;g.lineWidth=s.width||1.6;if(s.dash)g.setLineDash(s.dash);else g.setLineDash([]);
    var started=false;
    s.data.forEach(function(v,i){if(v==null){started=false;return}var x=padL+w*i/span,y=padT+h-h*Math.min(v,max)/max;if(!started){g.moveTo(x,y);started=true}else g.lineTo(x,y)});
    g.stroke();g.setLineDash([]);
    if(s.fill){g.lineTo(padL+w*(s.data.length-1)/span,padT+h);g.lineTo(padL,padT+h);g.closePath();g.fillStyle=s.fill;g.fill()}});
  g.fillStyle='#8b91a5';g.textAlign='left';
  if(hist.length>1){var t0=hist[Math.max(0,hist.length-n)].t,t1=hist[hist.length-1].t;g.fillText(ago(t1-t0),padL,H-4);g.textAlign='right';g.fillText('現在',W-padR,H-4)}
}
function ago(s){return s>=3600?Math.round(s/60)+' 分前':s>=60?Math.round(s/60)+' 分前':s+' 秒前'}
function redraw(){
  var r=rates(),lastR=r[r.length-1];
  var pick=function(k){return r.map(function(x){return x[k]})};
  drawChart('ch-rps',[{data:pick('rps'),color:'#5aa9ff',fill:'rgba(90,169,255,.12)'}],{});
  drawChart('ch-bps',[{data:pick('bps'),color:'#3ecf8e',fill:'rgba(62,207,142,.12)'}],{});
  drawChart('ch-hit',[{data:pick('hit'),color:'#f5b342'}],{max:100});
  drawChart('ch-active',[{data:pick('active'),color:'#c084fc',fill:'rgba(192,132,252,.12)'}],{});
  drawChart('ch-mem',[{data:pick('memlim'),color:'#8b91a5',dash:[4,4],width:1},{data:pick('rss'),color:'#ff6b6b',width:1},{data:pick('mem'),color:'#5aa9ff',fill:'rgba(90,169,255,.12)'}],{});
  drawChart('ch-disk',[{data:pick('disklim'),color:'#8b91a5',dash:[4,4],width:1},{data:pick('disk'),color:'#3ecf8e',fill:'rgba(62,207,142,.12)'}],{});
  if(lastR){$('c-rps').textContent=lastR.rps.toFixed(1);$('c-bps').textContent=lastR.bps.toFixed(2);$('c-hit').textContent=lastR.hit==null?'–':lastR.hit.toFixed(0)+'%';
    $('c-active').textContent=lastR.active;$('c-mem').textContent=lastR.mem.toFixed(0)+' / '+lastR.memlim.toFixed(0);$('c-disk').textContent=lastR.disk.toFixed(0)+' / '+lastR.disklim.toFixed(0);
    $('rps').textContent=lastR.rps.toFixed(1);$('bps').textContent=fmtBytes(lastR.bps*1048576)+'/s'}
}
function renderStatus(s){
  last=s;var c=s.cache||{};
  $('uptime').textContent='稼働 '+fmtDur(s.uptime_secs)+' · ログ '+(s.log_level||'');
  $('reqtotal').textContent='累計 '+fmtNum(s.total_requests)+' 要求';
  $('bytestotal').textContent='累計 '+fmtBytes(s.bytes_forwarded);
  $('active').textContent=fmtNum(s.active_connections);
  var o=s.origin_connections||{};$('origins').textContent='オリジン接続 新規 '+fmtNum(o.new)+' / 再利用 '+fmtNum(o.reused);
  var hits=c.hits||0,miss=c.misses||0;$('hitratio').textContent=(hits+miss)>0?(hits/(hits+miss)*100).toFixed(1)+'%':'–';
  $('hitdetail').textContent='命中 '+fmtNum(hits)+' (メモリ '+fmtNum(c.hits_memory)+' / ディスク '+fmtNum(c.hits_disk)+') · ミス '+fmtNum(miss);
  var m=c.memory||{},d=c.disk||{};
  var mp=pct(m.used_bytes,m.limit_bytes);$('memkpi').innerHTML=fmtBytes(m.used_bytes)+'<small>/ '+fmtBytes(m.limit_bytes)+'</small>';$('membar').style.width=mp+'%';$('membar').className=barClass(mp);
  $('memhint').textContent=fmtNum(m.entries)+' 件 · 予約 '+fmtBytes(m.reserved_bytes)+' · 余白 '+fmtBytes(m.keep_free_bytes);
  var dp=pct(d.used_bytes,d.limit_bytes);$('diskkpi').innerHTML=fmtBytes(d.used_bytes)+'<small>/ '+fmtBytes(d.limit_bytes)+'</small>';$('diskbar').style.width=dp+'%';$('diskbar').className=barClass(dp);
  $('diskhint').textContent=fmtNum(d.entries)+' 件 · 予約 '+fmtBytes(d.reserved_bytes)+' · 割当 '+(d.quota_mode||'')+(d.quota_bytes?' '+fmtBytes(d.quota_bytes):'')+(d.entry_limit_bytes&&d.entry_limit_bytes!==d.limit_bytes?' · 実データ上限 '+fmtBytes(d.entry_limit_bytes):'');
  var sys=c.system||{};
  var rows=[['保存',c.stores],['追い出し',c.evictions],['再検証',c.revalidations],['裏側の再検証',c.background_revalidations+' (進行中 '+c.revalidating+')'],['期限切れをそのまま配信',c.stale_served],['同時ミスの合流',c.coalesced+' (進行中 '+c.inflight+')'],['キャッシュから配信',fmtBytes(c.bytes_served)],
    ['RSS',fmtBytes(sys.process_rss_bytes)],['cgroup',sys.cgroup_limit_bytes?fmtBytes(sys.cgroup_usage_bytes)+' / '+fmtBytes(sys.cgroup_limit_bytes):'–'],['ホストのメモリ',sys.mem_total_bytes?(sys.mem_used_percent+'% 使用 / '+fmtBytes(sys.mem_total_bytes)):'–'],['メモリ圧迫',sys.mem_pressure?'あり':'なし']];
  $('cachetbl').tBodies[0].innerHTML=rows.map(function(r){return'<tr><td style="font-family:inherit">'+r[0]+'</td><td>'+(r[1]==null?'–':r[1])+'</td></tr>'}).join('');
  var hosts=(s.hosts||[]).slice(0,20);
  $('hosts').tBodies[0].innerHTML=hosts.map(function(h){var hr=(h.hits+h.misses)>0?h.hits/(h.hits+h.misses)*100:null;
    return'<tr><td title="'+esc(h.host)+'">'+esc(h.host)+'</td><td>'+fmtNum(h.requests)+'</td><td>'+fmtNum(h.hits)+'</td><td>'+fmtNum(h.misses)+'</td><td>'+fmtNum(h.bypass)+'</td><td>'+fmtNum(h.errors)+'</td><td>'+fmtBytes(h.bytes)+'</td><td>'+(hr==null?'<span class="tag">素通し</span>':hr.toFixed(0)+'%<span class="mini"><i style="width:'+hr+'%"></i></span>')+'</td></tr>'}).join('')||'<tr><td colspan="8" style="text-align:center;color:var(--muted)">まだ要求がありません</td></tr>';
}
function esc(s){return String(s).replace(/[&<>"]/g,function(ch){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]})}
function ok(good,msg){$('dot').className='dot'+(good?'':' bad');$('lastok').textContent=msg}
function fetchJson(u){return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})}
function pollStatus(){if($('pause').checked)return;fetchJson('/status').then(function(s){renderStatus(s);ok(true,'更新 '+new Date().toLocaleTimeString())}).catch(function(e){ok(false,'取得失敗: '+e.message)})}
function pollHistory(){if($('pause').checked)return;fetchJson('/history').then(function(h){hist=h.samples||[];redraw()}).catch(function(){})}
$('f-lookup').addEventListener('submit',function(e){e.preventDefault();var u=$('url').value.trim();if(!u)return;
  fetchJson('/lookup?url='+encodeURIComponent(u)).then(function(j){$('out').textContent=JSON.stringify(j,null,2)}).catch(function(e){$('out').textContent=e.message})});
$('btn-purge').addEventListener('click',function(){var u=$('url').value.trim();if(!u)return;
  fetchJson('/purge?url='+encodeURIComponent(u)).then(function(j){$('out').textContent=JSON.stringify(j,null,2);pollStatus()}).catch(function(e){$('out').textContent=e.message})});
$('btn-purge-all').addEventListener('click',function(){if(!confirm('キャッシュを全部消します。よろしいですか？'))return;
  fetchJson('/purge?all=1').then(function(j){$('out').textContent=JSON.stringify(j,null,2);pollStatus()}).catch(function(e){$('out').textContent=e.message})});
window.addEventListener('resize',redraw);
pollStatus();pollHistory();setInterval(pollStatus,2000);setInterval(pollHistory,5000);
})();
</script>
</body>
</html>
